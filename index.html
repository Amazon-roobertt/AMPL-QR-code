<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMPL - Gerador de Etiquetas Premium</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-print-color-adjust: exact; }
        .etiqueta-container { width: 190mm; height: 82mm; margin: 0 auto; }
        @media print { .print-hidden { display: none !important; } }
    </style>
</head>
<body class="min-h-screen bg-[#F1F5F9] text-slate-900 pb-24 relative overflow-x-hidden">

    <!-- Marca d'água -->
    <div class="fixed bottom-6 right-6 flex items-center gap-4 select-none opacity-20 hover:opacity-80 transition-opacity duration-300 pointer-events-none z-50 print-hidden">
        <div class="bg-black p-0 rounded-2xl shadow-xl flex flex-col items-center justify-center w-14 h-14 overflow-hidden border border-slate-800 leading-none relative shrink-0">
            <span class="text-white font-black text-[14px] tracking-tighter z-10 -mt-1 uppercase">AMPL</span>
            <svg viewBox="0 0 1024 1024" class="text-[#FF9900] w-full scale-150 absolute bottom-0.5" fill="currentColor">
                <path d="M685.2 648.2c-73.4 51.2-166.4 78.4-257.6 78.4-124.6 0-234.6-43.2-319.4-114.2-8.4-7-2-18.4 8.6-13.6 100.8 45.4 223.2 72.2 344.8 72.2 92.4 0 191.4-19 269.8-56.8 11.2-5.4 20.2 6.8 11.2 13.8-0.8 0.2-1.8 0.2-2.6 0.2zM715.4 584.2c-15.6-20.2-51.4-15.8-82.6-11.8-6.6 0.8-7.8-8.2-1.4-11 50.4-22.4 126.8-15.2 139.8 1.4 12.6 16.4-1 99.4-44.4 139-5.4 6.4-13-1-9.4-6.8 28-44.8 13.6-90.8-2-110.8z" />
            </svg>
        </div>
        <div class="flex flex-col">
            <span class="text-[11px] font-black uppercase tracking-tighter text-slate-900 leading-none">AMPL</span>
            <span class="text-[15px] font-black text-[#FF9900] leading-tight">@ROOBERTT</span>
        </div>
    </div>

    <div class="max-w-7xl mx-auto p-4 md:p-8 space-y-8">
        <!-- CABEÇALHO -->
        <header class="flex flex-col lg:flex-row lg:items-center justify-between gap-6 print-hidden">
            <div class="flex items-center gap-5">
                <div class="bg-black p-0 rounded-2xl shadow-xl flex flex-col items-center justify-center w-24 h-24 overflow-hidden border border-slate-800 leading-none relative shrink-0">
                    <span class="text-white font-black text-3xl tracking-tighter z-10 -mt-1 uppercase">AMPL</span>
                    <svg viewBox="0 0 1024 1024" class="text-[#FF9900] w-full scale-150 absolute bottom-1" fill="currentColor">
                        <path d="M685.2 648.2c-73.4 51.2-166.4 78.4-257.6 78.4-124.6 0-234.6-43.2-319.4-114.2-8.4-7-2-18.4 8.6-13.6 100.8 45.4 223.2 72.2 344.8 72.2 92.4 0 191.4-19 269.8-56.8 11.2-5.4 20.2 6.8 11.2 13.8-0.8 0.2-1.8 0.2-2.6 0.2zM715.4 584.2c-15.6-20.2-51.4-15.8-82.6-11.8-6.6 0.8-7.8-8.2-1.4-11 50.4-22.4 126.8-15.2 139.8 1.4 12.6 16.4-1 99.4-44.4 139-5.4 6.4-13-1-9.4-6.8 28-44.8 13.6-90.8-2-110.8z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-4xl font-black text-slate-800 tracking-tighter uppercase leading-tight">AMPL</h1>
                    <p class="text-slate-500 font-bold text-sm flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-[#FF9900]"></span>
                        Gerador de Etiquetas Premium
                    </p>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                <button id="btnClear" class="hidden flex items-center gap-2 bg-white border border-slate-200 text-red-500 hover:bg-red-50 px-5 py-3 rounded-xl transition-all font-bold text-sm shadow-sm">
                    <i data-lucide="trash-2" class="w-[18px]"></i> Limpar Tudo
                </button>

                <button id="btnDownload" disabled class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl transition-all shadow-md font-bold text-sm disabled:opacity-50 min-w-[180px] justify-center">
                    <i id="downloadIcon" data-lucide="download" class="w-[18px]"></i>
                    <span id="downloadText">Baixar PDF</span>
                </button>

                <label class="flex items-center gap-2 px-6 py-3 rounded-xl cursor-pointer transition-all shadow-md font-bold text-sm bg-[#FF9900] hover:bg-orange-600 text-white">
                    <i data-lucide="plus-circle" class="w-[18px]"></i>
                    <span id="fileLabel">Carregar Excel</span>
                    <input type="file" id="fileInput" class="hidden" accept=".xlsx, .xls, .csv" />
                </label>
            </div>
        </header>

        <!-- BARRA DE PROGRESSO (Oculta por padrão) -->
        <div id="progressArea" class="hidden bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <div class="flex items-center justify-between mb-2">
                <span class="text-sm font-bold text-slate-700">Processando Páginas...</span>
                <span id="progressText" class="text-sm font-black text-[#FF9900]">0%</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-3">
                <div id="progressBar" class="bg-[#FF9900] h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- CONFIGURAÇÕES -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 print-hidden">
            <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                <div><span class="text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1 block">Estado</span><input id="inState" type="text" value="SP" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-semibold"></div>
                <div><span class="text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1 block">Tipo</span><input id="inType" type="text" value="X" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-semibold"></div>
                <div><span class="text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1 block">Cód. Rota</span><input id="inRoute" type="text" value="5060" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-semibold"></div>
                <div><span class="text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1 block">Seq. Inicial</span><input id="inSeq" type="number" value="101" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-semibold"></div>
                <div><span class="text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1 block">Node</span><input id="inNode" type="text" value="SSJ" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-semibold"></div>
            </div>
            <button id="btnProcess" class="hidden w-full mt-6 bg-[#FF9900] hover:bg-orange-600 text-white font-black py-4 rounded-2xl shadow-lg uppercase tracking-tighter flex items-center justify-center gap-2">
                <i data-lucide="check-circle-2" class="w-5 h-5"></i> Gerar Visualização
            </button>
        </div>

        <!-- ÁREA DE PRÉ-VISUALIZAÇÃO -->
        <div class="bg-white rounded-[2.5rem] shadow-xl border border-slate-200 overflow-hidden">
            <div id="previewArea" class="p-4 md:p-12 bg-[#E2E8F0] overflow-auto min-h-[600px] flex flex-col items-center gap-16">
                <div id="emptyState" class="py-40 flex flex-col items-center justify-center text-center opacity-30 grayscale">
                    <div class="bg-white p-16 rounded-full shadow-inner mb-8"><i data-lucide="file-spreadsheet" class="w-24 h-24 stroke-1 text-[#FF9900]"></i></div>
                    <h3 class="text-4xl font-black text-slate-800 uppercase tracking-tighter">AMPL CORE</h3>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let processedData = [];

        function getRouteStyle(text) {
            const len = text.length;
            let size = '84px'; 
            if (len > 4) size = '70px';
            if (len > 6) size = '58px';
            if (len > 8) size = '50px';
            return `font-family: 'Inter', sans-serif; font-size: ${size}; font-weight: 900; line-height: 1.2; text-align: center;`;
        }

        const fileInput = document.getElementById('fileInput');
        const btnProcess = document.getElementById('btnProcess');
        const previewArea = document.getElementById('previewArea');
        const progressArea = document.getElementById('progressArea');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                document.getElementById('fileLabel').innerText = "Arquivo Pronto";
                btnProcess.classList.remove('hidden');
            }
        });

        btnProcess.addEventListener('click', () => {
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                
                const resKey = Object.keys(json[0]).find(k => k.toLowerCase().includes('resourceid'));
                const labKey = Object.keys(json[0]).find(k => k.toLowerCase().includes('label'));

                json.sort((a, b) => String(a[labKey]).localeCompare(String(b[labKey]), undefined, {numeric: true}));

                const startSeq = parseInt(document.getElementById('inSeq').value) || 101;
                processedData = json.map((row, i) => ({
                    resourceId: String(row[resKey]).trim(),
                    label: String(row[labKey]).trim(),
                    bagCode: `${document.getElementById('inState').value}-${document.getElementById('inType').value}-${document.getElementById('inRoute').value}-${startSeq + i}-${document.getElementById('inNode').value}`
                }));

                renderEtiquetas();
                document.getElementById('btnDownload').disabled = false;
                document.getElementById('btnClear').classList.remove('hidden');
            };
            reader.readAsArrayBuffer(file);
        });

        function renderEtiquetas() {
            previewArea.innerHTML = '';
            const chunks = [];
            for (let i = 0; i < processedData.length; i += 3) chunks.push(processedData.slice(i, i + 3));

            chunks.forEach((chunk, idx) => {
                const page = document.createElement('div');
                page.id = `page-chunk-${idx}`;
                page.className = "flex flex-col items-center bg-white shadow-2xl border border-slate-200 relative shrink-0 mb-10";
                page.style = "width: 210mm; height: 297mm; padding: 15mm 0;";
                
                let html = `<div class="absolute top-2 left-6 text-[9px] font-black text-slate-300 uppercase tracking-widest">AMPL PAG ${idx + 1}</div>
                            <div class="flex flex-col items-center justify-center h-full w-full gap-8 px-4">`;

                chunk.forEach(item => {
                    html += `
                    <div class="etiqueta-container bg-white border-[2px] border-black rounded-[2.5rem] p-10 flex items-center justify-center relative shrink-0">
                        <div class="grid grid-cols-[1.2fr_1.6fr_1.2fr] w-full h-full items-center">
                            <div class="flex flex-col items-center justify-center space-y-4 text-center h-full">
                                <span class="text-xl font-black uppercase tracking-widest text-slate-900 leading-none">BAG CODE</span>
                                <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(item.bagCode)}" class="w-[180px] h-[180px]">
                            </div>
                            <div class="flex flex-col items-center justify-center border-x-[2px] border-dotted border-slate-200 h-full px-4 text-center">
                                <span class="text-sm font-black text-[#FF9900] mb-4 tracking-[0.4em] uppercase shrink-0 leading-none">ROTA</span>
                                <div class="w-full flex items-center justify-center">
                                    <span style="${getRouteStyle(item.label)}">${item.label}</span>
                                </div>
                            </div>
                            <div class="flex flex-col items-center justify-center space-y-4 text-center h-full">
                                <span class="text-xl font-black uppercase tracking-widest text-slate-900 leading-none">CARRINHO</span>
                                <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(item.resourceId)}" class="w-[180px] h-[180px]">
                            </div>
                        </div>
                    </div>`;
                });

                html += `</div><div class="absolute bottom-4 w-full text-center text-[9px] font-bold text-slate-300 uppercase tracking-[0.6em]">AMPL LOGISTICS • ETIQUETA PADRÃO A4</div>`;
                page.innerHTML = html;
                previewArea.appendChild(page);
            });
        }

        // DOWNLOAD COM PROCESSAMENTO PÁGINA A PÁGINA (MELHOR RESOLUÇÃO E SEM ERRO)
        document.getElementById('btnDownload').addEventListener('click', async function() {
            const btn = this;
            const downloadText = document.getElementById('downloadText');
            btn.disabled = true;
            progressArea.classList.remove('hidden');

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
            const pages = previewArea.querySelectorAll('[id^="page-chunk-"]');

            for (let i = 0; i < pages.length; i++) {
                // Atualiza Barra
                const pct = Math.round(((i + 1) / pages.length) * 100);
                progressBar.style.width = `${pct}%`;
                progressText.innerText = `${pct}%`;
                downloadText.innerText = `Lendo pág. ${i+1}`;

                // Renderiza a página específica
                const canvas = await html2canvas(pages[i], {
                    scale: 2.5, // Alta resolução
                    useCORS: true,
                    backgroundColor: "#ffffff",
                    logging: false
                });

                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                if (i > 0) pdf.addPage();
                pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);

                // IMPORTANTE: Limpa o canvas da memória após adicionar ao PDF
                canvas.remove();
                await new Promise(r => setTimeout(r, 100)); // Pequena pausa para o navegador respirar
            }

            pdf.save(`AMPL_Etiquetas_${new Date().getTime()}.pdf`);
            
            downloadText.innerText = "Baixar PDF";
            btn.disabled = false;
            setTimeout(() => progressArea.classList.add('hidden'), 2000);
        });

        document.getElementById('btnClear').onclick = () => location.reload();
    </script>
</body>
</html>
